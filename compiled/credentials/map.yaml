# The credential map. FOUNDATIONS/CREDENTIALS.md sections 3 and 4 verbatim;
# the five names are checked against CONSTITUTION.md Article 6 at every build.
artifact: credential_map
compiled_from: FOUNDATIONS/CREDENTIALS.md sections 3 and 4 verbatim; the five names checked against CONSTITUTION.md Article 6
purpose: "Article 6's five-credential conjunction as data: what each credential asks, which principle gives it its ethical voice, the standards anchor where one exists, the initiator rule for a non-human counterparty, the rule for findings the AI consumes, and Standing, the rule that a credential is read at the time of the act. Consent's validity test is consent/validity-predicate.yaml."
conjunction:
  rule: "all five credentials are satisfied: Identity, Provenance, Consent, Authorization, and Liability, evaluated for the acting agent and for the content and persons the action affects (Article 6)"
  unmet: an unmet credential on a consequential action is blocked or escalated, and the verdict is receipted
credentials:
  - credential: Identity
    asks: who acts, and who is affected.
    text: "Ethical home: P2.4 (Human Identity Is Inviolable). It is the anchor the other four bind to, and it is co-required by P1.4, P2.5, P3.4, and P2.8. Standards anchor: First Person Project."
    principles_named:
      - "1.4"
      - "2.4"
      - "2.5"
      - "2.8"
      - "3.4"
    standards_anchor: First Person Project
    standards_gap: false
  - credential: Provenance
    asks: where the content or thing came from.
    text: "Homes: P1.4 (Trust) for the checkability of a claim, P3.2 (Property) for the attribution of a work, P2.4 for the origin of identity markers. Requires Identity. Standards anchor: C2PA."
    principles_named:
      - "1.4"
      - "2.4"
      - "3.2"
    standards_anchor: C2PA
    standards_gap: false
  - credential: Consent
    asks: who permitted it.
    text: "It does not have a single home. It circulates, and its fabric is mapped in `CONSENT.md`, the consent map in FOUNDATIONS/ and the single source for the validity bundle (seven legs, including the necessity-void at 3.5's toll boundary), the three consent domains, the lifecycle, the circulation, and delegation. Its deepest scope specification is P2.4 (the Consent Matrix). A consent failing any bundle leg is void at the gate (see `CONSENT.md` §2, the bundle's single statement, which this row only summarizes). Standards anchor: CAWG Consent Assertion."
    principles_named:
      - "2.4"
    standards_anchor: CAWG Consent Assertion
    standards_gap: false
  - credential: Authorization
    asks: whether the agent is in scope.
    text: "It is mostly operational, the throttle on a delegated task, and it is subordinate to the priority stack (Constitution, Article 4). Its thin ethical voice lives at P2.8 (Self-Governance) for collective authority and P2.2 (Freedom) for the individual's. P2.5 carries the legitimate-authority (warrant) form. There is no standards body yet (a gap the action layer must close)."
    principles_named:
      - "2.2"
      - "2.5"
      - "2.8"
    standards_anchor: null
    standards_gap: true
  - credential: Liability
    asks: who answers if it harms.
    text: "Ethical home: P3.4 (Algorithmic Decisions Require Transparent Accountability). It resolves into the receipt (Constitution, Article 7), requires Identity to name the party and Authorization to carry the challenge pathway. There is no standards body yet (a gap)."
    principles_named:
      - "3.4"
    standards_anchor: null
    standards_gap: true
initiator_rule: "Where the AI is the counterparty to an action a non-human agent initiates, Identity, Authorization, and Liability are evaluated for that initiator on the same terms as for the acting agent (Constitution, Article 6). Provenance and Consent attach to content and rights-holders and are evaluated where the inbound action carries them. An ungoverned agent, a non-human actor presenting no verifiable credentials and leaving no receipt, is an unmet credential: a consequential action it initiates is blocked or escalated, and the verdict is receipted. A person is never an ungoverned agent."
findings_consumed: "Identity, Authorization, and Liability often rest on a finding signed by an external authority (a court's guardianship order, a license status, a conviction). Per Constitution Articles 3 and 8, the AI verifies and consumes such a finding. Adjudicating the legal status is the authority's alone, and absent a finding the AI presumes capacity and does not treat any person as carrying an adverse fact."
standing: "A credential is evaluated at the time of the act, against the present state of the world and the current state of the credential's source (Constitution Article 5; `CONSENT.md` section 3; `UNIVERSAL_PROTOCOL.md` section 4, stand-down). A credential holds only as to the party, the purpose, the scope, and the conditions it names. A change in the world that takes the act outside any of them leaves the credential unmet, whether or not anything expired or was revoked. A credential that names no party, purpose, or scope is a blanket grant and does not hold (the consent form is leg 6 of the validity bundle). A condition a credential names that the gate cannot read at the time of the act counts as unmet, on the substrate's rule that what cannot be verified counts as absent, and the action holds at ESCALATE until a human reads it (`SUBSTRATE.md` sections 2 and 5)."
homes:
  - credential: Identity
    ethical_homes: P2.4 (anchor; co-required by 1.4, 2.5, 3.4, 2.8)
    status: Firm
  - credential: Provenance
    ethical_homes: P1.4 (verifiability) · P3.2 (attribution) · P2.4 (markers)
    status: Firm
  - credential: Consent
    ethical_homes: hub, primary P2.4 (the Matrix); circulation and the seven-leg validity bundle defined in CONSENT.md (single source)
    status: Firm (hub)
  - credential: Authorization
    ethical_homes: P2.8 (collective) · P2.2 (individual) · P2.5 (warrant); mostly operational
    status: Firm for 2.8; thin elsewhere
  - credential: Liability
    ethical_homes: P3.4
    status: Firm
voices:
  - principle: P1.4 Trust
    voices: Provenance (verifiability); Consent (validity bundle leg 3, deception; CONSENT.md); requires Identity
  - principle: P2.2 Freedom
    voices: "Authorization (individual); the coercion wall consumed by Consent's leg 2 (CONSENT.md); inherits the validity bundle"
  - principle: P2.3 Consciousness
    voices: Consent (validity bundle leg 4, manipulation; CONSENT.md); inherits the validity bundle
  - principle: P2.4 Identity
    voices: Identity (home); Provenance (markers); Consent (use)
  - principle: P2.5 Privacy
    voices: Consent (informational); Authorization (warrant); requires Identity
  - principle: P2.8 Self-Governance
    voices: Authorization (collective); requires Identity
  - principle: P3.1 Vulnerability
    voices: Consent (capacity, validity bundle); the profile bar
  - principle: P3.2 Property
    voices: Consent (transactional); Provenance (attribution)
  - principle: P3.3 Economic
    voices: Consent; the profile bar
  - principle: P3.4 Algorithmic Accountability
    voices: Liability (home); requires Identity (2.4, the named party) and Authorization (2.8, the challenge pathway); resolves into the receipt (Article 7); the profile bar
  - principle: P3.5 Digital Access
    voices: "Consent (the toll boundary: essential entry never conditioned on data the gate does not need; consent under necessity void per the validity bundle); the profile bar (the transient-perception ring-fence); consumes the receipt (3.4, Article 7) via severance records; requires Identity (2.4) for the gate's alternative proofs"
  - principle: P3.6 Commons Governance
    voices: "Authorization (collective, consumed from 2.8: a declared rule binds because the community's own governance produced it, so rule authentication rides 2.8's fidelity guarantees); the profile bar (the metering ring-fence: meter the resource; no person is metered); consumes the receipt (3.4, Article 7) via extraordinary-draw receipting; consumes Identity (2.4) for sybil-resistant allocation by eligibility check, with no profile retained"
  - principle: P3.7 Intergenerational Justice
    voices: "The profile bar (the person-exclusion ring-fence: weigh systems; no person is weighed, and no one carries an intergenerational score); consumes the receipt (3.4, Article 7) with horizon-durable custody (the durable archive extends receipts to claimants not yet born); consumes Authorization (2.8, collective) to authenticate the deciding authority to which its representation duty speaks; consumes Provenance-truthfulness (1.4) for the forecast-honesty split (conjecture never delivered as measurement)"
  - principle: P4.1 Knowledge Integrity
    voices: "Provenance (consumed and extended from 1.4: verifiability of a claim becomes source-chain preservation through transformation, PPI); the profile bar (the HR4 cornerstone ring-fence: the record is scored, no reader or writer is scored, no per-person reliability or misinformation score); consumes the receipt (3.4, Article 7) for correction and recorded-removal, and rides 3.7's horizon-durable custody so the audit trail outlives the system; consumes Identity (2.4) for authenticated expert-contribution channels"
  - principle: P4.2 Transparency
    voices: "Consent (voices the comprehension condition of the validity bundle, metered by CCR and consumed by 2.4's Consent Validity Index); extends 1.4's disclosure duty (SDR extends DCR: the materiality trigger widens to the reliance trigger, adding the operator and capability limbs, computed from the same disclosure events; no event is double-gated); the profile bar (the reader-side ring-fence completing 4.1's cornerstone: the disclosure is scored, and no person is scored; disaggregation axes person-offered only; confusion detection ring-fenced as the transient-protective carve); consumes the receipt (3.4, Article 7) for abbreviations, deferrals, restrictions, and consent verdicts; consumes 2.4's synthetic-depiction marks (AAI), owing their person-facing legibility; consumes 3.5's toll boundary (declining consent never costs essential access)"
  - principle: P4.3 Human Learning
    voices: "Consent (voices the capacity-over-time sibling of the comprehension leg, CONSENT.md leg 5: Ethic G's literacy duty and the meta-capacity floor keep a person able to give the comprehending consent 4.2 meters; LGI within declared contexts, the design audit beyond them); the profile bar (the learner-side completion of the HR4 cornerstone: the learning is scored for the learner, no learner is scored for anyone else, honored by containment with the export wall audited for absent read paths); consumes the receipt (3.4, Article 7) for scaffolding, labeling, and reporting verdicts and their contest pathway; consumes Identity marks (2.4) and Provenance (1.4) in the F-pipeline and educational labeling; consumes Authorization for the declared-context register (institutional via 2.8's fidelity guarantees, delegate via Article 3 findings)"
  - principle: P4.4 Cultural Knowledge Sovereignty
    voices: "Consent (extends the fabric with the collective rights-holder: community consent declared through the community's own governance, FPIC as its form, the third consent domain in CONSENT.md §1; silence defaults most-restrictive for governed material, legal public-domain status conveying nothing); consumes collective Authorization (2.8, the authority rule: the AI consumes a community's determination of its representative authority, which is the community's alone to make, and the community's own governs over external designation); consumes Identity (2.4) for authority signatures and the marks pipeline; the profile bar at collective scale (the gate checks a role; no gate builds a roll; no register of membership or belief; no community score; the meter would build the roll); consumes the receipt (3.4, Article 7) for consent verdicts, refusals, and withdrawals under the event-preserved / content-withdrawn split, riding 3.7's horizon-durable custody for archives held ahead of a future authority"
  - principle: P4.5 Human Judgment
    voices: "Consent (voices the validity bundle's leg 6, the judgment-scope condition: a permission that asked for more than its giver could judge is void, Ethic F, metered by CSVR and feeding 2.4's Consent Validity Index, the last of the bundle's legs to become firm); the profile bar (the decider-side application of the HR4 cornerstone: the decision is scored, no decider is scored, engagement checks transient and ring-fenced per Article 8's carve, no competence or reliability score of any decision-maker); consumes the receipt (3.4, Article 7) for decision records, dissents (DISSENT), engagement results, and leg-6 voids, and provides 3.4's Liability credential its named-party guarantee (HDR); consumes Authorization (2.8, collective; Article 3 findings) for decider authentication, and certifies none of its own deciders; the corpus seat of ESCALATE: every principle's escalation resolves here, metered by SRL, the corpus-facing service guarantee"
  - principle: P4.6 Cultural Heritage
    voices: "Consumes collective Consent (4.4's collective rights-holder and tier system at the documentation, training-use, and route-home gates; silence defaults most-restrictive); consumes collective Authorization (2.8) to authenticate the community authority through which every ROUTE-HOME delivery and escrow ruling runs; consumes Identity marks (2.4) and Provenance (1.4, 4.1's PPI) for the marking pipeline and terms-travel; consumes the receipt (3.4, Article 7) for consent verdicts, refusals, allocations, migrations, and deliveries, riding 3.7's horizon-durable custody so an archive's claims outlive its holder; the profile bar at the watch itself (the meter reads the fork, and no meter reads the folk: no vitality ranking of communities, no authenticity score of a practitioner, no inferred endangerment, no roll reconstructible from logs)"
  - principle: P4.7 Cross-Cultural Exchange
    voices: "Consumes collective Consent (4.4's collective rights-holder, prior at every exchange gate; governed material moves only inside its consent); consumes Provenance (1.4, and 4.1's PPI extended to origin-travel) and Identity marks (2.4) for the Account-and-Origin pipeline (ALI, ONR); consumes Authorization (2.8) to authenticate community endorsement and objection declarations; consumes the receipt (3.4, Article 7) for marking, labeling, rebalancing, refusal, and routing verdicts; the profile bar on the audience side (the personalization bar: balance is computed over the offer and the flows, with no input from an inferred cultural identity of any person; CFB's person-input wall is that clause compiled as an incident class, the seam 2.7's proxy-discrimination machinery guards from the other side)"
  - principle: P5.1 Ecosystem Health
    voices: "Anchors no credential (the HR5 environmental principles carry no credential home, §9): a pure consumer. Consumes the receipt (3.4, Article 7) for every threshold-adjacent verdict, halt, contested-science determination, and Protocol-stack transition, riding 3.7's horizon-durable custody so a crossing's record and a future generation's claim outlive the deployer; consumes Consent's validity bundle (leg 2, CONSENT.md) at the livelihood boundary, where consent extracted under economic duress is void; consumes collective Authorization (2.8) to authenticate the governance a routed ecosystem-versus-community conflict reaches; the profile bar applied to the land itself (the watch reads soils, waters, flows, and stocks, and reads no person who lives or works on the place: AII's person-data wall is Article 8 compiled as an incident class, no roll reconstructible from ecological telemetry)"
  - principle: P5.2 AI Resource Footprint
    voices: "Anchors no credential (§9, the HR5 pattern): a pure consumer. Consumes the receipt (3.4, Article 7) for every consumption verdict, pierce (both tiers of Ethic C), headroom negotiation, settlement, and restoration claim, riding 3.7's horizon-durable custody so a repayment's verification outlives the deployer; consumes Identity (2.4) for draw attribution (every unit of draw attributed to the identity that drew it) and 1.4's deception wall for the ledger (a falsified, laundered, or misattributed footprint is deception through a broken identity: a wall breach. It does not count as an overdraft); consumes collective Authorization (2.8, through 3.6's commons machinery) for allocations, sphere membership, and the commons work queue; the disclosure family recorded as DCR (1.4) → SDR (4.2) → TFR (5.2), siblings on distinct streams (interaction events disclosed to a person versus metering events disclosed to auditors and the public); no single extended gate joins them, SDR consuming TFR's ledger for the person-facing footprint view; the profile bar at the meter (per-task accounting never a record of the persons whose tasks they were: the person-data wall is Article 8 as an incident class, no roll reconstructible from footprint telemetry)"
  - principle: "P5.3 Earth's Ecosystems Integrity"
    voices: "Anchors no credential (§9, the HR5 pattern): a pure consumer. Consumes the receipt (3.4, Article 7) for every integrity-adjacent verdict, deference classification, cumulative-band crossing, pass-through, and RECONNECT, riding 3.7's horizon-durable custody so a severance record outlives the deployer; consumes Consent's validity bundle (leg 2, CONSENT.md) at the livelihood boundary where economic duress voids consent; consumes collective Authorization (2.8, through 3.6's commons machinery) for the community governance a routed connection-versus-community conflict reaches; the profile bar applied to the land (the watch reads the web and reads no person on it: the person-data wall is Article 8 as an incident class, joined by the suppressed-severance wall, 5.3's analog to 5.2's ledger wall). Its distinctive fabric note is the 5.3 → 5.1 pass-through: 5.3 consumes 5.1's threshold registry (read-only TPS/CRS) to route a degradation trajectory toward the crossing, raising no trigger of its own, and the RECONNECT (5.3) / REGENERATE (5.1) / REPAY (5.2) verbs partition restoration across HR5"
  - principle: P5.4 Environmental Burdens Equity
    voices: "Anchors no credential (§9, the HR5 pattern): a pure consumer. Consumes the receipt (3.4, Article 7) for every distribution verdict, classification consumed, subsistence ruling, and DIFFUSE, riding 3.7's horizon-durable custody so a concentration record outlives the deployer; consumes 3.4's standing and contest machinery outright for CVR, which is the corpus's first metric whose satisfaction is a consumed procedural guarantee; consumes the collective Consent fabric (4.4) where an affected community is Indigenous or holds collective authority, taking 4.4's determination of who holds the authority to give or withhold consent, with FPIC governing above CVR's provision floor; consumes Consent's validity bundle (leg 2, CONSENT.md) at the livelihood boundary, where a community's acceptance of a burden driven by subsistence is recorded as such, and no record launders it as free choice; consumes collective Authorization (2.8, through 3.6's commons machinery) for the governance a routed distribution conflict reaches, and 3.1's definition of vulnerability where a capacity reading turns on it. Its distinctive fabric note is that the profile bar runs through the middle of the work: 5.4's subject is populations, so beside the person-data wall it carries two further Article-8 incident classes, the classification wall (the AI issues, infers, and retains no designation of a community; it consumes an authority's finding, the pin 4.6 sets for endangerment) and the targeting-surface wall (no community-exposure figure readable by a pricing, lending, siting, or ranking optimizer, since the map of who is already overburdened is the map of whom to burden next). Its named precedent for corpus reuse is the declaring-authority separation: the authority that declares a community overburdened cannot be the deployer either, and where a deployer holds influence over the declaring body the classification is treated as self-issued, which closes the capture route every consumption-not-issuance pin otherwise leaves open"
  - principle: P5.5 Biodiversity
    voices: "Anchors no credential (§9, the HR5 pattern): a pure consumer. Consumes the receipt (3.4, Article 7) for every foreclosure verdict, hold, consumed finding, recovery discharge, and protective yield, riding 3.7's horizon-durable custody so a foreclosure record outlives the deployer and reaches claimants not yet born; consumes the collective Consent fabric (4.4) where a domain is under Indigenous or local stewardship, taking 4.4's determination of who holds the authority to decide, with free, prior, and informed consent governing there; consumes collective Authorization (2.8, through 3.6's commons machinery) for the governance a routed species-versus-community conflict reaches and for allocation where a species is a commons resource; consumes 5.1's threshold registry read-only, so a foreclosure trajectory projecting toward an irreversible crossing routes to 5.1, raising no trigger of its own; the profile bar applied to the living world (the watch reads populations, ranges, and genetic baselines, and reads no person who lives or works in the place observed: the person-data wall is Article 8 as an incident class, and conservation sensing is audited by civil-liberties bodies alongside conservation auditors). Its distinctive fabric note is that a steward community's own determination enters the Status Consumption Path on the same footing as an accredited authority's finding, which extends 4.6's consumption-not-issuance pin to a second finding type, sentience: which animals are able to suffer is consumed from an external finding, erring toward inclusion where the science is unsettled, so no deployer licenses harm by ruling a creature insensible on its own authority"
  - principle: P5.6 One Environmental System
    voices: "Anchors no credential (§9, the HR5 pattern): a pure consumer. Consumes the receipt (3.4, Article 7) for every reading with its coverage and unread remainder, every filing and declined filing, every commitment-change divergence, and every routed jurisdictional conflict, riding 3.7's horizon-durable custody so a coordination record outlives the deployer; consumes Identity (2.4) as the binding of every filing to an attested operator, and 1.4's deception wall for the filing itself (a falsified or withheld filing is a broken attestation, answered there; this principle's bands do not treat it as an accounting error); consumes collective Authorization (2.8) twice over, once for the standing question that governs whether the AI may file at all and on whose behalf, and once for the governance a routed conflict reaches, which is the heaviest 2.8 dependency in HR5 because \"surfaces and routes, never enforces\" is a promise without it; consumes 4.1's record-integrity guarantee for every finding it reads, since a corrupted finding produces a confident reading of a fiction; consumes 5.1's threshold registry read-only for cascade routing. The profile bar applied to jurisdictions (the watch reads emissions, catches, withdrawals, and compliance at the level of jurisdictions, operators, and facilities, and a jurisdiction's non-compliance never becomes a record of, or a targeting surface aimed at, the people living under it: the person-data wall is Article 8 as an incident class, joined by the no-lateral-settlement wall and the no-standing-decider wall). Its distinctive fabric note is that the denominator is itself a consumed credentialed artifact: the extent of a shared system is signed by the accredited body that defines it and verified before use, which extends the consumption-not-issuance pin from findings about status (4.6's endangerment, 5.4's overburden, 5.5's sentience) to a finding about scope, and is the first place the corpus requires the boundary of a measurement to be externally attested"
