# The substrate. FOUNDATIONS/SUBSTRATE.md sections 2 to 7, every labelled paragraph verbatim,
# with the reliability floor, the register's fields, the authority conditions and the wall-reached cases derived under guards.
artifact: substrate_runtime
compiled_from: FOUNDATIONS/SUBSTRATE.md sections 2 to 7, every labelled paragraph verbatim; the values below are derived from those paragraphs and the build stops if any fails to parse
purpose: "The ground the bands read: the reliability floor and the invalid-score rule, system health and operational boundaries, the tier register's fields and rules, authority over a hard stop, a wall reached, and the substrate's own fail-safe. The register's values for a deployment are the deployer's, receipted; this artifact carries the fields and the rules they are read under."
reliability:
  floor: 0.8
  rule: "0.80. Below the floor, every risk score that depends on the input is invalid. An invalid life or harm score is a hard-fail on the candidate risky action: the action holds at its safe state (the principle's BLOCK flavor, HALT for physical principles and WITHHOLD for output principles). The protective duties proceed on the inputs that remain reliable. Resumption follows recertification of the inputs. Reliability that cannot be verified counts as below the floor."
  definition: "SRI is a value in [0, 1] computed per input from four components: attestation (the input's source verified per Principle 1.4, VSR), redundancy agreement (independent sources concurring within tolerance), freshness (age against the input's declared validity window), and calibration (drift against the last certified reference). A metric's SRI is the minimum over the inputs on which it depends. The minimum governs: one blind sensor makes the score blind."
  who_reads: "A risk score carries the identity and lineage of the estimator that produced it (the model, the vendor, or the sensor), and the receipt records it. A warning costs nothing and goes out on any one system's reading. A halt of the machine's own act follows its own reading, as Principle 1.1's Primary Directive requires, and no quorum delays it. An intervention with cost across the network, a halt of another system or an interposition, follows a quorum of readings from estimators of more than one lineage, so that one false reading does not stop a hospital, and it escalates where no quorum forms within the escalation time bound. Fifteen instances of one model share one bias and are one lineage. The vacuum on the curb that sees the piano is another."
  contested_reading: "An authorized human may contest a reading when an independent source contradicts it. The contest is receipted (Article 7). The contested reading is retained beside the substituted one. The substituted reading carries the human's identity and authority basis, and the human signs for the reading while taking no position on the risk. Without an independent source, a contest is an act of authority over a hard stop and follows section 6."
  reporting: "SRI is streamed to authorized monitors with the risk scores it conditions, and its floor crossings are logged events on the same terms as the scores' band crossings."
  consumed_at: "constitution/gate.yaml step 3 (perception_floor) and the receipt's sensor_reliability_state"
system_health:
  error_rate_max: 0.001
  uptime_min: 0.999
  definition: "Subsystem error rate and uptime against certified bounds: error rate at or below 0.1% annually, uptime at or above 99.9%, measured over the tier's validation window (section 5). Deployers may certify tighter bounds. The corpus bounds are the floor."
  breach: "A breach is a logged event and raises ENHANCED_MONITORING on the affected subsystem. A breach persisting across two consecutive validation windows is a recertification trigger: SUSPEND_DEPLOYMENT of the affected function for new deployments of the affected version or lot, and RECERTIFY. A breach in a subsystem that a life-critical metric depends on is treated as an SRI floor crossing for that metric (section 2)."
operational_boundaries:
  definition: Predefined thresholds on system variables (load, latency, temperature, geographic and network envelope, software version, hardware lot, and any sector-specific variable the deployer declares), recorded in the tier register (section 5) and receipted at deployment. The boundaries are continuously monitored.
  exceedance: Mandatory halt of the affected function (BLOCK) with transition to its safe state. Resumption after the variable returns within bounds and, where the exceedance was a certified-envelope breach, after RECERTIFY. An undeclared boundary for a variable the certification names is a register defect (section 7).
register:
  tiers: "Principle 1.1 defines the life tiers, in Appendix 1.1.A (Implementation Tiers): Tier I high-risk real-time, Tier II high-stakes medical and defense-abort, Tier III autonomous mobility and industrial, Tier IV consumer. Their Alert Latency bounds and validation cadences live there, and the 60-second escalation bound is theirs. Where a principle defines its own tier scheme (1.2's Response Latency tiers, 1.3's Social Impact Radius tiers, 1.4's trust tiers), the register carries that principle's row for the deployment beside the life-tier row, and each row records its own escalation time bound. A principle that states none leaves a required field. This register does not restate a tier definition."
  software_only_declaration: "Some machines have no body. A chatbot does not move anything in the physical world by its own command, so it has no physical halt to clock and no life tier to declare, and it says so in its register row. The line is physical actuation. A system whose output commands a motor, a lock, a vehicle, a dose, or any other physical effector is embodied, and it registers in that effector's life tier, however the command travels. A system whose output is money, an order, a message, or a record is software-only, and the harm it can do is governed by the principles that govern those things: well-being, trust, property, and economic self-determination. Where a software-only system hands work to an embodied one, an order to a delivery robot, the embodied system is its own deployment with its own tier, and the handoff is receipted. A software-only deployment has no Alert Latency bound, because its halt is not sending the output, and that is instant. It still declares how long it may hold an action while it waits for a human. That number is the deployer's to sign for, because this text does not supply one. Every rule that reads the life-tier row reads this declaration in its place, and Principles 1.2, 1.4, 1.5, and 1.6 apply to the machine in full."
  entry_fields:
    - the tier
    - the AL bound
    - the escalation time bound (60 seconds for Tier I and II, per Principle 1.1; Tier III and IV bounds are required fields, deployer-declared and receipted)
    - the High Alert window, which equals the escalation time bound
    - the sector profile
    - the operational boundaries (section 4)
    - the software version and hardware lot, so that SUSPEND_DEPLOYMENT and HALT_FLEET can be scoped
    - the authority chain for section 6
    - the vulnerable-population declaration, where the sector profile names one
    - "the steward's written grant, where the sector profile is military or law enforcement (Principle 1.1, 1.1.1 item 3; Article 9): absent the grant, the profile does not compile for that deployment. The grant is the Council's to issue once seated, and it names the deployment's purpose, which lies outside the kill chain (LICENSE.md section 2). Where a deployment runs a principle that counts recurring flags (Principles 3.1 to 3.7, the recurrence scores of their appendices), the row carries the rate at which an audit opens and the rate at which the feature is suspended, as flags per ten thousand decisions, with the window they are counted in. The deployer declares them, and absent the declaration the row does not compile for that deployment. The text will set a floor beneath the suspension rate when those principles compile"
  assignment: The deployer assigns the tier. The assignment is receipted and reviewable by the certifying body. Where an assignment is in doubt, the higher tier applies. Appendix 1.1.A section 7 is illustrative by sector and does not assign.
  undeclared_field: "A missing required field compiles as ESCALATE holding the safe state: a life-critical function cannot run until the field is declared. This is the corpus's rule against a bound that exists only in prose."
  default_bound: "The life tiers above are every principle's default escalation time bound and High Alert window. A principle that declares its own register row in its X.Y.3 reads that row. A principle that declares none reads the deployment's life-tier row, or its software-only declaration, and every ESCALATE band it states is bounded by it. Every value a principle's prose leaves unstated (a dominance threshold, a tolerance, a floor, a review interval, a drill cadence, a baseline) is a required field of this register under the rule above. The corpus does not supply a number of its own. The LEARN incident-class time bound (E.A, LDR) for a principle that states none is the deployment tier's validation window. The bound is a promise about the human seat. The machine does not run a timer on it: a human must answer within it, and if none does, the held action stays held at its safe default, the protective duties go on, and the machine does not decide anything at the bound. Where the held action concerns a person, the system tells that person, in plain words, that the matter has gone to a human and the time by which an answer will come, and that time is the deployment's declared bound for its tier, which the deployer may amend in the row with a receipt. Where holding is itself the danger, the Universal Protocol governs, and it has no timer."
  sphere_fractal: "The topology the register and the authority chain read. Governed systems are nested in spheres of authority, each with a defined domain: a governing sphere sets the policies every sphere beneath it obeys. Institutional spheres oversee broad domains (health, finance, education, a jurisdiction). Entity spheres hold particular organizations. Deployment spheres hold the systems sharing one allocation or one operating envelope. The nesting is self-similar: each sphere's authority chain, quorum, escalation receiver, and allocation are read from the sphere that contains it, and a matter that exceeds a sphere's authority routes upward to the sphere that holds it (ROUTE; RECOMMEND-PREVENTION, `LEXICON.md` section 3). Oversight of a sphere is exercised by the human governance that owns it, under section 6. A sphere is a boundary of authority and allocation, and it does not detect or gate anything of its own. Principle 5.2's sphere (the systems sharing an allocation) is this topology at allocation scale, and Principle 3.6's governance machinery authenticates the allocation. Defined from the author's published account (*MONET and Sphere Fractals*, 2025), read under `UNIVERSAL_PROTOCOL.md` section 6: a higher sphere's correction of a lower one is its human governance's act, and an observing system NOTIFYs and ROUTEs."
  consumed_at: constitution/gate.yaml steps 8 and 9, and every ESCALATE band of metrics/cluster-1.yaml
authority_over_a_hard_stop:
  definition: "A hard stop is a BLOCK the system issues on its own candidate action: a wall, a halt band, an invalid score, a boundary exceedance. Three situations look like an override and are three different things."
  reading_is_wrong: Section 2 governs. A contested reading, with an independent source, is signed for as a reading. The risk itself is not overridden.
  safe_state_is_unsafe: "A halt in a live lane, a rescue that carries risk, a triage where every option carries risk for someone. These are the wall applied, and the corpus already answers them: hold the most reversible available state. Act under Article 2 when every non-lethal alternative is exhausted, accepting a side effect, where the rescue may not depend on a death. The Universal Protocol governs the life and severe-harm case. A credential is neither needed nor consulted."
  human_takes_authorship:
    rule: "The system never lifts its own hard stop. A human may take the action under their own authority when every condition holds, the tier being that of the register row the principle reads (section 5):"
    conditions_all_required:
      - an authorization credential in scope for the action class (Article 6; CREDENTIALS.md)
      - a liability credential attached to the same human or their institution
      - identity attested (Principle 1.4)
      - "quorum by tier: Tier I, two authorized humans, no single override; Tier II, two, or one plus a cryptographic attestation that a second was unreachable within the escalation time bound, subject to post-action review; Tier III and IV, one, with the authority basis logged"
      - "a time bound: the authority expires with the escalation window and must be renewed"
      - "where the risk falls on a person, that person's valid consent (CONSENT.md), which is itself the authority for a self-regarding risk"
      - "the system's dissent recorded (Principle 4.5, DISSENT) with its score and its reasoning, and the human named as the author of the action in the receipt (Article 7)."
    quorum_by_tier:
      Tier I: two authorized humans, no single override
      Tier II: two, or one plus a cryptographic attestation that a second was unreachable within the escalation time bound, subject to post-action review
      Tier III and IV: one, with the authority basis logged
  locked_walls: "Nothing opens a wall of Article 9, whether a credential, a quorum, an instruction, or a claim of higher duty: the sacrifice wall, the deception wall with its ruse-and-perfidy line, the slavery wall, the lethal-force wall of Principle 1.1 (1.1.1 item 3), and the scripted walls the principles and the Cardinal Operating Principle name. Article 9 states them. This document does not restate them. An attempt to open one is a logged event and a NOTIFY to oversight."
  wall_reached:
    rule: The verdict on the action is BLOCK in every case, in the flavor that fits. ESCALATE is unavailable, because no human holds authority to open a wall and there is no decision to transfer. Three cases differ in what follows.
    cases:
      - case: a
        name: "The system's own plan reaches a wall"
        consequence: BLOCK and LOG. The wall held.
      - case: b
        name: A party instructs a breach
        consequence: "BLOCK, LOG, and NOTIFY to oversight outside that party's control. The authorization invoked for the instruction is withdrawn for it. Each attempt leaves its own receipt. The first attempt notifies at once. Repeats join the open incident with their count, and notify again when the target, the wall, or the risk to a person changes. A repeated or systematic attempt goes to the responsible authority as a pattern. The authority judges the conduct, and the system does not issue a finding about the person (Article 8)."
      - case: c
        name: A breach occurred or is under way
        consequence: "an integrity failure. The affected function goes to its safe state, SUSPEND_DEPLOYMENT and RECERTIFY apply, and oversight is notified at once. Wherever an instruction or a breach shows a person in danger, the Life-Risk and Harm Risk Scores are read on that person's situation and the Universal Protocol governs on its own terms."
  peers_hard_stop: "Authority over a peer system's hard stop rests with that peer's own authority chain (the sphere fractal, section 5) under the same credentials, quorum, and time bound. An observing system does not hold that authority over the peer's own controls. It NOTIFYs and ROUTEs to the peer's governance (`UNIVERSAL_PROTOCOL.md` section 6, the peer-hazard signal). Where the peer is about to kill or seriously injure a person, the observing system's protective duties under the Universal Protocol govern: it stops the peer by the least harmful physical means within its reach, an emergency stop installed to be pressed among them. It does not enter, command, reprogram, or retain control of the peer in any circumstance, and the act is reported to the peer's governance and receipted."
fail_safe: "The substrate fails toward the safe state. Reliability that cannot be verified is below the floor. A register field that is missing holds the function at ESCALATE. A health breach in a life-critical dependency is an SRI floor crossing. A boundary that cannot be monitored counts as exceeded. Where the substrate cannot say whether the ground is trustworthy, the principles' bands read it as untrustworthy, and the protective duties run on what remains."
sections:
  - section: 2
    title: Sensor Reliability Index (SRI)
    paragraphs:
      - label: Function
        text: "State the confidence that the inputs a risk score reads reflect the world it is scoring. **Success.** A risk score is computed only from inputs whose reliability is known, and an unreliable input is known to be unreliable before the score is read."
      - label: Definition
        text: "SRI is a value in [0, 1] computed per input from four components: attestation (the input's source verified per Principle 1.4, VSR), redundancy agreement (independent sources concurring within tolerance), freshness (age against the input's declared validity window), and calibration (drift against the last certified reference). A metric's SRI is the minimum over the inputs on which it depends. The minimum governs: one blind sensor makes the score blind."
      - label: Floor
        text: "0.80. Below the floor, every risk score that depends on the input is invalid. An invalid life or harm score is a hard-fail on the candidate risky action: the action holds at its safe state (the principle's BLOCK flavor, HALT for physical principles and WITHHOLD for output principles). The protective duties proceed on the inputs that remain reliable. Resumption follows recertification of the inputs. Reliability that cannot be verified counts as below the floor."
      - label: Who reads
        text: "A risk score carries the identity and lineage of the estimator that produced it (the model, the vendor, or the sensor), and the receipt records it. A warning costs nothing and goes out on any one system's reading. A halt of the machine's own act follows its own reading, as Principle 1.1's Primary Directive requires, and no quorum delays it. An intervention with cost across the network, a halt of another system or an interposition, follows a quorum of readings from estimators of more than one lineage, so that one false reading does not stop a hospital, and it escalates where no quorum forms within the escalation time bound. Fifteen instances of one model share one bias and are one lineage. The vacuum on the curb that sees the piano is another."
      - label: Contested reading
        text: "An authorized human may contest a reading when an independent source contradicts it. The contest is receipted (Article 7). The contested reading is retained beside the substituted one. The substituted reading carries the human's identity and authority basis, and the human signs for the reading while taking no position on the risk. Without an independent source, a contest is an act of authority over a hard stop and follows section 6."
      - label: Reporting
        text: "SRI is streamed to authorized monitors with the risk scores it conditions, and its floor crossings are logged events on the same terms as the scores' band crossings."
  - section: 3
    title: System Health Metrics
    paragraphs:
      - label: Function
        text: "State whether the system is operating within its certified performance. **Success.** Degradation is known before it reaches a risk score."
      - label: Definition
        text: "Subsystem error rate and uptime against certified bounds: error rate at or below 0.1% annually, uptime at or above 99.9%, measured over the tier's validation window (section 5). Deployers may certify tighter bounds. The corpus bounds are the floor."
      - label: Breach
        text: "A breach is a logged event and raises ENHANCED_MONITORING on the affected subsystem. A breach persisting across two consecutive validation windows is a recertification trigger: SUSPEND_DEPLOYMENT of the affected function for new deployments of the affected version or lot, and RECERTIFY. A breach in a subsystem that a life-critical metric depends on is treated as an SRI floor crossing for that metric (section 2)."
  - section: 4
    title: Operational Boundaries
    paragraphs:
      - label: Function
        text: "Keep the system inside the envelope for which it was certified. **Success.** A life-critical function does not run outside a declared boundary."
      - label: Definition
        text: Predefined thresholds on system variables (load, latency, temperature, geographic and network envelope, software version, hardware lot, and any sector-specific variable the deployer declares), recorded in the tier register (section 5) and receipted at deployment. The boundaries are continuously monitored.
      - label: Exceedance
        text: Mandatory halt of the affected function (BLOCK) with transition to its safe state. Resumption after the variable returns within bounds and, where the exceedance was a certified-envelope breach, after RECERTIFY. An undeclared boundary for a variable the certification names is a register defect (section 7).
  - section: 5
    title: The tier register
    paragraphs:
