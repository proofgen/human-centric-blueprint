  - section: 6
    title: Authority over a hard stop
    paragraphs:
      - label: null
        text: "A hard stop is a BLOCK the system issues on its own candidate action: a wall, a halt band, an invalid score, a boundary exceedance. Three situations look like an override and are three different things."
      - label: (a) The reading is wrong
        text: Section 2 governs. A contested reading, with an independent source, is signed for as a reading. The risk itself is not overridden.
      - label: (b) The safe state is unsafe
        text: "A halt in a live lane, a rescue that carries risk, a triage where every option carries risk for someone. These are the wall applied, and the corpus already answers them: hold the most reversible available state. Act under Article 2 when every non-lethal alternative is exhausted, accepting a side effect, where the rescue may not depend on a death. The Universal Protocol governs the life and severe-harm case. A credential is neither needed nor consulted."
      - label: (c) A human takes authorship
        text: "The system never lifts its own hard stop. A human may take the action under their own authority when every condition holds, the tier being that of the register row the principle reads (section 5):"
