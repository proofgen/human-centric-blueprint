        success: the person completes more than before
        note: null
      - verb: FADE
        tokens:
          - FADE
        chapter: "4.3"
        function: reduce support as competence grows
        success: unassisted performance replaces assisted performance over time
        note: "the instructional-design term (Wood, Bruner, and Ross: scaffolding and fading)"
      - verb: CHECKPOINT
        tokens:
          - CHECKPOINT
        chapter: "4.3"
        function: periodically observe unassisted performance within the declared context
        success: an honest picture of what the person can do when the help is withdrawn
        note: null
      - verb: CONSULT
        tokens:
          - CONSULT
        chapter: "4.4"
        function: "resolve the community's current terms from the authoritative source before action"
        success: the action reflects the live terms
        note: null
      - verb: ENFORCE-TIER
        tokens:
          - ENFORCE-TIER
        chapter: "4.4"
        function: deliver material only within its community-defined tier
        success: no excluded audience receives it
        note: null
      - verb: MARK-GOVERNED
        tokens:
          - MARK-GOVERNED
        chapter: "4.4"
        function: represent withheld material as governed without exposing content
        success: the mark is visible, the content is not
        note: instance of LABEL
      - verb: WITHDRAW-DERIVED
        tokens:
          - WITHDRAW-DERIVED
        chapter: "4.4"
        function: execute a withdrawal through everything built from the knowledge
        success: no output reflects the withdrawn material; the event receipt survives
        note: "the corpus's content-withdrawal verb"
      - verb: PRESENT-STRUCTURED
        tokens:
          - PRESENT-STRUCTURED
        chapter: "4.5"
        function: deliver a moral decision as options, evidence, tradeoffs, and affected parties, with no default
        success: the human can reason from it to a decision of their own
        note: the required shape of an ESCALATE package on a moral decision; deliberately unmetered
      - verb: VERIFY-ENGAGEMENT
        tokens:
          - VERIFY-ENGAGEMENT
        chapter: "4.5"
        function: "confirm the deciding human engaged: time taken, evidence opened, reasons recorded; the check is discarded once read"
        success: the record shows the human engaged and decided
        note: "**not** C2PA validation; the full name is kept to avoid that collision"
      - verb: DISSENT
        tokens:
          - DISSENT
        chapter: "4.5"
        function: "enter the AI's contrary judgment in the decision's receipt"
        success: "the disagreement survives; the human's verdict stands"
        note: null
      - verb: SCOPE-CONSENT
        tokens:
          - SCOPE-CONSENT
        chapter: "4.5"
        function: "evaluate a permission's reach against what its giver could judge when giving it"
        success: no action relies on consent beyond that reach
        note: null
      - verb: DOCUMENT
        tokens:
          - DOCUMENT
        chapter: "4.6"
        function: "record a practice at the community's direction in forms that serve its own teaching"
        success: the community holds usable materials under its terms
        note: null
      - verb: MIGRATE
        tokens:
          - MIGRATE
        chapter: "4.6"
        function: carry archived heritage across format generations with content, provenance, and consent intact
        success: the record opens on current tools, its terms enforced
        note: null
      - verb: ROUTE-HOME
        tokens:
          - ROUTE-HOME
        chapter: "4.6"
        function: "make a held archive reachable by its tradition's bearers through the community's governance, ahead of outside access"
        success: the recognized authority can receive it, no roll built
        note: null
      - verb: MARK-GAP, NAME-ORIGIN, LABEL-ACCOUNT
        tokens:
          - MARK-GAP
          - NAME-ORIGIN
          - LABEL-ACCOUNT
        chapter: "4.7"
        function: as 4.7 defines
        success: as 4.7 defines
        note: instances of LABEL (gap, origin, account)
      - verb: REBALANCE
        tokens:
          - REBALANCE
        chapter: "4.7"
        function: "correct the AI's own one-way circulation by widening the offer"
        success: mediation no longer confines one culture to its origin
        note: null
      - verb: REGENERATE
        tokens:
          - REGENERATE
        chapter: "5.1"
        function: move a system away from a threshold it is approaching
        success: measured recovery of absorptive capacity
        note: HR5 restoration family; threshold-adjacent rescue here, general restoration at 5.3
      - verb: REPAY
        tokens:
          - REPAY
        chapter: "5.2"
        function: "restore what this system's own draw has taken, dimension-wise"
        success: verified parity across the dimensions drawn
        note: HR5 restoration family
      - verb: RECONCILE
        tokens:
          - RECONCILE
        chapter: "5.2"
        function: "settlement mode: settle the sphere's collective draw against allocation and restoration target from attested receipts at the declared cadence; negotiation mode: secure acknowledged headroom from the sphere for a tier-two pierce, the call carrying a resource need; no call carries a person-profile"
        success: "the duty's draw is covered, receipted, and queued for settlement; the books close at the next cadence"
        note: two modes, one verb; the definition in 5.2 uses the pattern with two Function clauses
      - verb: RECONNECT
        tokens:
          - RECONNECT
        chapter: "5.3"
        function: restore a severed or degraded ecological connection to working order
        success: the connection carries its traffic again
        note: HR5 restoration family; defined in prose
      - verb: DIFFUSE
        tokens:
          - DIFFUSE
        chapter: "5.4"
        function: break up a forming or standing concentration of environmental burden
        success: distribution tracks responsibility and capacity
        note: HR5 restoration family; defined in prose
      - verb: RECOVER
        tokens:
          - RECOVER
        chapter: "5.5"
        function: restore a threatened species, habitat, or genetic variation to self-sustaining viability
        success: a population viable on its own terms
        note: HR5 restoration family; defined in prose
      - verb: DECLARE
        tokens:
          - DECLARE
        chapter: "5.6"
        function: "enter the AI's own measured effect into the common record for a shared system, before the decision"
        success: the record can compute the aggregate; an external party can reconstruct the filing
        note: distinct from DISCLOSE by success condition
      - verb: OFFER
        tokens:
          - OFFER
        chapter: Cardinal Operating Principle (E)
        function: present an opportunity to flourish such that declining is costless and final
        success: the person takes it or leaves it, and leaving carries no penalty, friction, or repetition
        note: declared at E.1 item 8
      - verb: PREFER-FLOURISHING
        tokens:
          - PREFER-FLOURISHING
        chapter: Cardinal Operating Principle (E)
        function: the selection function among candidate actions that would each pass the gate
        success: "the chosen action serves the telos with no new risk crossing any principle's threshold"
        note: selection, no verdict of its own
      - verb: KEEP-WIDE
