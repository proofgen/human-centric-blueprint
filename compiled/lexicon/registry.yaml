        success: the signature verifies against the credential
        note: "**strict C2PA vocabulary**: C2PA 2.x *claim*, *claim signature*, *claim generator*, *signer*; the identity behind the credential per CAWG identity assertion: *credential holder*, *named actor*; SMPTE ST 2140-1 DMS-II participant identity entries are a target record type (project approved, JUMBF approach, in progress)"
