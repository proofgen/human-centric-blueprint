theoria:
  core_precept: "1. A community governs its cultural knowledge and its own relationship with AI; that authority includes the right to refuse."
  resulting_ethics:
    A: "Never collect, train on, or generate from a community's cultural knowledge without community consent."
    B: "Honor a refusal as a complete answer: final, owed no justification, and never punished."
    C: "Cultural knowledge moves only with its conditions of transmission: who may learn it, from whom, at what stage, in what setting."
    D: Never reconstruct, infer, or approximate what a community has withheld.
    E: "A community's yes stays its own: scoped to the uses it names, conditional on the terms it sets, revocable, and a withdrawal reaches what was built from the knowledge."
  floor: "Verifying that a person may receive role-restricted knowledge is an eligibility check, transient and discarded: the gate checks a role and never builds a roll. No register of persons' community membership, belief, or ethnicity is formed or retained (Constitution, [Article 8](../CONSTITUTION.md)), and no community is scored either: an openness rating of communities would be the profile bar at collective scale, a targeting surface for extraction. Verdicts here attach to materials and uses, never to persons."
  line: "A community's restriction is a governance decision, never a gap in the record: 4.1 marks absence and never fills it, and here the mark reads *governed*, not *missing*. 3.6 keeps what a community shares from being enclosed; 4.4 keeps what a community withholds from being opened. The consent fabric gains its collective rights-holder here: community consent binds because the community's own governance produced it (authenticated per 2.8, as 3.6's rules are), and where a community's self-determination of its representative authority conflicts with an external determination, the community's own governs. A community choosing little or no AI keeps full essential access (3.5)."
