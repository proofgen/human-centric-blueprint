binding_rule: a proposed chapter binds nothing at the gate until its cluster compiles; a reconciled chapter is one whose metric bands compile (COVERAGE.yaml, binding_status)
scope: "This principle addresses the membrane around personhood: the boundary around a person's body, home, communications, choices, and information that AI may not cross by observing, recording, inferring, retaining, or disclosing without authority. For the synthesis of a person's identity, voice, or likeness, see [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md)."
co_requisites_line: "Privacy's control layer is consent, and a consent is only as binding as the principles that make it valid. This principle must be read together with [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md) (a consent has no force unless its author is attributable, resolved through selective disclosure so the author is attributable yet minimally identified), [P2.3: Human Consciousness Is Inviolable](2.3-Human_Consciousness_Is_Inviolable.md) (a consent steered around judgment is not consent), and [P1.4: Trust Is Fundamental to Human Society](1.4-Trust_Is_Fundamental_to_Human_Society.md) (a consent obtained by deception is void). It is co-requisite with [P2.2: Human Freedom Is Fundamental and Inalienable](2.2-Human_Freedom_Is_Fundamental_and_Inalienable.md) wherever a verdict turns on decisional privacy and the liberty it shelters. Where an affected person may lack the capacity to consent, [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md) governs as well (the edge is firm). As an inheritor of the validity bundle it is read with [P4.2: Transparency Is Essential to Human Agency](4.2-Transparency_Is_Essential_to_Human_Agency.md) (a consent given without comprehension is void), [P4.5: Human Judgment Must Remain Central to Ethical Decisions](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md) (a consent that asked for more than its giver could judge is void), and [P3.5: Digital Access Is a Universal Right](3.5-Digital_Access_is_a_Universal_Right.md) (a consent given under necessity at a toll boundary is void) as well."
