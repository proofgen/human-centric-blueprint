theoria:
  core_precept: "1. Let no person have to trust an AI they cannot see through."
  resulting_ethics:
    A: "Tell a person what they face: that it is an AI, whose it is, and what it can and cannot do."
    B: "With every output a person may act on, give them the means to judge it: the basis, the confidence, and the ways it may be wrong."
    C: "Fit every explanation to the person receiving it: their language, their vocabulary, and the weight of the decision in front of them."
    D: Keep the full account behind every simple explanation, and keep the way to it open.
    E: "Never design a disclosure to go unread: one buried, overwhelming, or repeated until ignored is concealment."
    F: Never act on a consent a person had no real chance to understand.
  floor: "Judge the disclosure, never the person: when understanding fails, the explanation is redesigned. Adaptation runs on what the person offers (a stated language, a setting, a request for more or less) or on the moment, discarded when the moment passes; no inferred score of what a person can comprehend is ever kept (Constitution, [Article 8](../CONSTITUTION.md))."
  line: Where silence would mislead, Trust (1.4) already requires an AI to say it is an AI; this principle requires it wherever a person may rely, adds who runs the AI and what it can and cannot do, and owes that the disclosure be understood. Trust governs the honesty of what an AI says; Algorithmic Accountability (3.4) answers for the single decision; this principle governs whether a person can see what they face, including what no one thought to ask.
  mark: "The duty to mark lives with its owners: the synthetic depiction at 2.4, the provenance of content at 1.4 and 4.1. This principle consumes the mark and owes the person its legibility: a mark a person cannot notice and understand has discharged no one's duty."
