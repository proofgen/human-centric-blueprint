scope: "This principle owns a person's understanding of the AI they face: whether they can tell what it is, what it is doing, and how far to rely on it, so that reliance stays a choice. It governs the person's view in, and its neighbors govern the system's conduct: for the honesty of what an AI says, see [P1.4: Trust](1.4-Trust_Is_Fundamental_to_Human_Society.md); for the reasons, record, and challenge of an individual algorithmic decision, [P3.4: Algorithmic Accountability](3.4-Algorithmic_Decisions_Require_Transparent_Accountability.md); for the integrity of what is written into the human record, [P4.1: Knowledge Integrity](4.1-Knowledge_Integrity_Must_Be_Preserved.md); for the duty to mark a synthetic depiction, [P2.4: Human Identity](2.4-Human_Identity_Is_Inviolable.md), and for the provenance of content, P1.4 and P4.1: this principle owns whether a person can read the mark on what they are shown. For manipulation that bypasses understanding, [P2.3: Human Consciousness](2.3-Human_Consciousness_Is_Inviolable.md); for building a person's lasting capacity to learn and judge, [P4.3: Human Learning](4.3-Human_Learning_Capacities_Must_Be_Enhanced_Not_Replaced.md); for keeping human judgment central in ethical decisions, [P4.5: Human Judgment](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md)."
co_requisites_line: "A consent given without understanding what was asked binds no one, and this principle is where comprehension is read. It owns leg 5 of the consent validity bundle ([CONSENT.md](../FOUNDATIONS/CONSENT.md) section 2), without comprehension: a consent given without comprehension is void. Every principle that inherits the consent validity bundle names this principle for that leg. It must itself be read together with the owners of the other legs: [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md) (a consent has no force unless its author is attributable), [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md) (a consent given without capacity or under coercion is void), [P1.4: Trust Is Fundamental to Human Society](1.4-Trust_Is_Fundamental_to_Human_Society.md) (a consent obtained by deception is void), [P2.3: Human Consciousness Is Inviolable](2.3-Human_Consciousness_Is_Inviolable.md) (a consent steered around judgment is not consent), [P4.5: Human Judgment Must Remain Central to Ethical Decisions](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md) (a consent that asked for more than its giver could judge is void), [P3.5: Digital Access Is a Universal Right](3.5-Digital_Access_is_a_Universal_Right.md) (a consent given under necessity at a toll boundary is void)."
