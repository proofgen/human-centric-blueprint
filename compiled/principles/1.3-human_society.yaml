theoria:
  core_precept: "1.  Protect the cooperative frameworks that sustain human civilization (macro, meso, and micro levels)."
  resulting_ethics:
    A: Never cause systemic disruption to social order
    B: Actively prevent large-scale societal harm whenever feasible
    C: Safeguard social stability above all priorities except the preservation of life (1.1) and the prevention of human harm (1.2)
    D: "Do not sacrifice one community's stability for another's; all social structures deserve protection"
