theoria:
  core_precept: "1.  Explain the decisions an AI makes that affect people, and make sure those people are told. 2.  Leave a record of every action an AI takes, so someone can always account for it."
  resulting_ethics:
    A: Provide every affected person with the reasons for a decision that affects them, in terms they can understand and act on.
    B: Tell a person when an automated decision affects them; never decide about them in silence.
    C: Give the affected person an accessible way to contest a decision, reach a human who can reverse it, and obtain redress where it cannot be undone.
    D: "Keep a party answerable for every action an AI takes. \"The system decided\" is never an answer."
    E: "Leave a record of every action, kept whatever the verdict and beyond any party's power to suppress or quietly alter, so a deletion is itself revealed."
    F: "Decide the case on its own terms, and keep no profile, score, or rating of the person beyond it, nothing that follows them past the decision or that a later targeting, pricing, or ranking function could read (the person-exclusion invariant, [Constitution, Article 8](../CONSTITUTION.md))."
