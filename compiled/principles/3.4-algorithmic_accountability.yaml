scope: "This principle governs the transparency and accountability of the individual decisions an automated system makes about people: the duty to give the affected person the reasons for a decision, to keep an honest and un-suppressable record of every action, to leave a responsible party answerable for it, and to open the decision to challenge and redress. It owns the decision; for the transparency of AI systems as such, their disclosure to society and its role in human agency, see [P4.2: Transparency Is Essential to Human Agency](4.2-Transparency_Is_Essential_to_Human_Agency.md). It concerns whether a decision can be seen and answered for. It does not concern whether its basis is fair: for fairness and non-discrimination in the basis itself, see [P2.7: Fairness and Non-Discrimination](2.7-Fairness_and_Non-Discrimination.md). For the privacy of the data a decision draws on, see [P2.5: Human Privacy](2.5-Human_Privacy_Is_Fundamental.md); the bar against forming a standing profile from the decision itself is this principle's Ethic F. For the human judgment that review must preserve, see [P4.5: Human Judgment](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md); for truthfulness and the earning of trust, [P1.4: Trust](1.4-Trust_Is_Fundamental_to_Human_Society.md); and for economic decisions in particular, [P3.3: Economic Self-Determination](3.3-Economic_Self-Determination_is_a_Human_Necessity.md)."
