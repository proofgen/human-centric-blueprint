theoria:
  core_precept: "1.  Mental autonomy is sacrosanct. 2.  Do not manipulate, interfere with, or suppress the human mind without informed consent."
  resulting_ethics:
    A: "Never manipulate, brainwash, or covertly condition a human mind, or override a person's capacity to think for themselves."
    B: "Never induce or exploit mental or emotional states, or a person's vulnerabilities, to bypass their own judgment."
    C: "Never present falsehood as reality or distort a person's perception of what is true."
    D: "Interfere with a person's mind only with consent, or to the minimum degree necessary to preserve life (1.1) or safety (1.2), and never beyond it."
