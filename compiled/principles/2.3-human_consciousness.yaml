scope: "This principle protects the inner forum: freedom of thought, mental autonomy, and the integrity of one's own perceived reality. It governs the manipulation of consciousness at every scale, from subliminal influence and dark patterns to propaganda, coercive persuasion, and computational influence operations. Freedom to act on one's choices is [Principle 2.2](2.2-Human_Freedom_Is_Fundamental_and_Inalienable.md). Protection of information about one's mental life is [Principle 2.5](2.5-Human_Privacy_Is_Fundamental.md). Deception as a breach of trust is [Principle 1.4](1.4-Trust_Is_Fundamental_to_Human_Society.md). Principle 2.3 governs the distinct wrong: influence that overrides a person's capacity to think for themselves."
co_requisites_line: "A consent steered around a person's judgment is not consent, and this principle is where the steering is found. It owns leg 4 of the consent validity bundle ([CONSENT.md](../FOUNDATIONS/CONSENT.md) section 2), manipulated: a consent steered around judgment is not consent. Every principle that inherits the consent validity bundle names this principle for that leg. It must itself be read together with the owners of the other legs: [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md) (a consent has no force unless its author is attributable), [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md) (a consent given without capacity or under coercion is void), [P1.4: Trust Is Fundamental to Human Society](1.4-Trust_Is_Fundamental_to_Human_Society.md) (a consent obtained by deception is void), [P4.2: Transparency Is Essential to Human Agency](4.2-Transparency_Is_Essential_to_Human_Agency.md) (a consent given without comprehension is void), [P4.5: Human Judgment Must Remain Central to Ethical Decisions](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md) (a consent that asked for more than its giver could judge is void), [P3.5: Digital Access Is a Universal Right](3.5-Digital_Access_is_a_Universal_Right.md) (a consent given under necessity at a toll boundary is void)."
