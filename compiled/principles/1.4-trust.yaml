scope: "This principle addresses trust between humans, between institutions, and between humans and AI systems, and the truthful conduct that sustains it. For the integrity of the knowledge bases AI systems learn from and produce (accuracy, provenance, and contextual faithfulness of knowledge itself), see [P4.1: Knowledge Integrity](4.1-Knowledge_Integrity_Must_Be_Preserved.md)."
co_requisites_line: "An attestation is void without an attester, so this principle requires [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md). It owns leg 3 of the consent validity bundle (a consent obtained by deception is void), and every principle that inherits the consent validity bundle names this principle for that leg. It inherits the rest ([CONSENT.md](../FOUNDATIONS/CONSENT.md) section 2): [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md) (capacity and coercion), [P2.3: Human Consciousness Is Inviolable](2.3-Human_Consciousness_Is_Inviolable.md) (manipulation), [P4.2: Transparency Is Essential to Human Agency](4.2-Transparency_Is_Essential_to_Human_Agency.md) (comprehension), [P4.5: Human Judgment Must Remain Central to Ethical Decisions](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md) (the giver's judgment), and [P3.5: Digital Access Is a Universal Right](3.5-Digital_Access_is_a_Universal_Right.md) (necessity)."
