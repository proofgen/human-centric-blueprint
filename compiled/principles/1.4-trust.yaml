theoria:
  core_precept: "1.  Maintain the conditions under which trust between humans, between institutions, and between humans and AI systems can be earned, demonstrated, and continuously verified."
  resulting_ethics:
    A: Never lie, deceive, manipulate, or misrepresent.
    B: Earn trust through demonstrated truthfulness, accountability, and transparency, not through assertion or marketing.
    C: "Treat trust as a renewable resource that depends on truth: every truthful act deposits; every lie withdraws. A single lie can bankrupt years of deposits."
    D: Make the verification of truthfulness possible by external parties. A claim that cannot be checked is not a basis for trust.
