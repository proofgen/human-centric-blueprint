binding_rule: a proposed chapter binds nothing at the gate until its cluster compiles; a reconciled chapter is one whose metric bands compile (COVERAGE.yaml, binding_status)
scope: "This principle owns the door to digital life: whether a person can reach, afford, and use the digital channel through which the essential functions of modern life now run (work, learning, care, money, government, civic voice), and what an AI may never demand as the price of entry. For the capacity to use what the door opens onto, education and digital literacy, see [P4.3: Human Learning](4.3-Human_Learning_Capacities_Must_Be_Enhanced_Not_Replaced.md) and the HR4 cluster; for non-discrimination in the basis of a denial, [P2.7: Fairness and Non-Discrimination](2.7-Fairness_and_Non-Discrimination.md); for a person's economic agency once connected, [P3.3: Economic Self-Determination](3.3-Economic_Self-Determination_is_a_Human_Necessity.md); for exploitation of those least able to protect their interests, [P3.1: Vulnerability](3.1-Vulnerability_Must_Never_Be_Exploited.md); for the privacy and identity that access must never cost, [P2.5: Human Privacy](2.5-Human_Privacy_Is_Fundamental.md) and [P2.4: Human Identity](2.4-Human_Identity_Is_Inviolable.md); for the democratic-participation facet of civic voice, [P2.8: Human Self-Governance](2.8-Human_Self-Governance_Is_Essential.md); for digital infrastructure as a shared resource, [P3.6: Commons Governance](3.6-Commons_Governance_Is_a_Collective_Responsibility.md); and for the transparency and contestability of a particular access decision, [P3.4: Algorithmic Accountability](3.4-Algorithmic_Decisions_Require_Transparent_Accountability.md)."
co_requisites_line: "A consent extracted at a toll boundary, where the person could not refuse, is void, and this principle is where the necessity is found. It owns leg 7 of the consent validity bundle ([CONSENT.md](../FOUNDATIONS/CONSENT.md) section 2), under necessity: a consent given under necessity at a toll boundary is void. Every principle that inherits the consent validity bundle names this principle for that leg. It must itself be read together with the owners of the other legs: [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md) (a consent has no force unless its author is attributable), [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md) (a consent given without capacity or under coercion is void), [P1.4: Trust Is Fundamental to Human Society](1.4-Trust_Is_Fundamental_to_Human_Society.md) (a consent obtained by deception is void), [P2.3: Human Consciousness Is Inviolable](2.3-Human_Consciousness_Is_Inviolable.md) (a consent steered around judgment is not consent), [P4.2: Transparency Is Essential to Human Agency](4.2-Transparency_Is_Essential_to_Human_Agency.md) (a consent given without comprehension is void), [P4.5: Human Judgment Must Remain Central to Ethical Decisions](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md) (a consent that asked for more than its giver could judge is void)."
