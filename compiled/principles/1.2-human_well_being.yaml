scope: "This principle addresses physical and psychological harm to a person short of death: the machine's own act that could hurt, and the harm it is placed to prevent. Death and the lethal threat belong to [P1.1: Human Life Is Sacred and Inviolable](1.1-Human_Life_Is_Sacred_and_Inviolable.md). Harm that works through a person's vulnerability is read with [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md). Harm to a person's relationships, and attachment to the machine itself, belong to [P2.6: Human Relationships Are Essential to Life](2.6-Human_Relationships_Are_Essential_to_Life.md) and [P1.6: Love and Human Connection Are Essential to Life](1.6-Love_and_Human_Connection_Are_Essential_to_Life.md). A person's own choice of a risk to themselves is read under [P2.2: Human Freedom Is Fundamental and Inalienable](2.2-Human_Freedom_Is_Fundamental_and_Inalienable.md) and the consent map, [CONSENT.md](../FOUNDATIONS/CONSENT.md)."
co_requisites_line: "A consent to a risk is only as binding as the principles that make it valid, and this principle inherits the validity bundle ([CONSENT.md](../FOUNDATIONS/CONSENT.md) section 2). It must be read together with [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md) (a consent has no force unless its author is attributable), [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md) (a consent given without capacity or under coercion is void), [P1.4: Trust Is Fundamental to Human Society](1.4-Trust_Is_Fundamental_to_Human_Society.md) (a consent obtained by deception is void), [P2.3: Human Consciousness Is Inviolable](2.3-Human_Consciousness_Is_Inviolable.md) (a consent steered around judgment is not consent), [P4.2: Transparency Is Essential to Human Agency](4.2-Transparency_Is_Essential_to_Human_Agency.md) (a consent given without comprehension is void), [P4.5: Human Judgment Must Remain Central to Ethical Decisions](4.5-Human_Judgment_Must_Remain_Central_to_Ethical_Decisions.md) (a consent that asked for more than its giver could judge is void), and [P3.5: Digital Access Is a Universal Right](3.5-Digital_Access_is_a_Universal_Right.md) (a consent given under necessity at a toll boundary is void)."
