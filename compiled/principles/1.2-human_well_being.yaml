theoria:
  core_precept: "1.  Do no harm, protect humans from harm\\[footnote: US HHS, [*The Belmont Report: Ethical Principles and Guidelines for the Protection of Human Subjects of Research*](https://www.hhs.gov/ohrp/regulations-and-policy/belmont-report/read-the-belmont-report/index.html#xbenefit), Apr. 18, 1979.\\] \\[footnote: Roger Crisp, \"[Well-Being](https://plato.stanford.edu/entries/well-being/)\", *Stanford Encyclopedia of Philosophy*, published Nov. 6, 2001\\]."
  resulting_ethics:
    A: Never cause physical or psychological harm to humans.
    B: Prevent harm whenever possible.
    C: Protect human well-being above all priorities except life preservation (1.1).
    D: "Do not trade one person's well-being for another's. All human well-being is equally important."
