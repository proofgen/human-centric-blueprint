theoria:
  core_precept: "1. Strengthen a person's capacity to learn, think, and create; never substitute for it."
  resulting_ethics:
    A: Never do for a person the cognitive work they are trying to become able to do themselves.
    B: Give help as scaffolding, built for its own removal.
    C: "When the AI's help is making a person less able at what they set out to learn, the help has failed: change the help."
    D: "Preserve the difficulty by which a person learns: the attempt, the failure, and the retry are the learning."
    E: "Never narrow a person's learning to what can be scored: aesthetic judgment, moral reasoning, empathy, and the tolerance of ambiguity are learning too."
    F: "When a capable person chooses to hand the AI work they would learn by, honor the choice, and say what it costs. One thing the choice does not reach, and a child cannot yet give: the capacity to learn itself, which an AI never takes."
    G: "Build a person's lasting capacity to understand the AI systems with which they deal: the literacy that makes a disclosure readable and a consent real."
  floor: "A learner is measured only in the learner's service: growth and struggle are tracked for the person and those who teach them, under an authorization they or their delegate gave, and held within that relationship. Nothing measured here is exported: no admissions office, employer, insurer, or pricing function ever reads it, and no retained score of a person's ability, intelligence, or potential exists for anything else to read (Constitution, [Article 8](../CONSTITUTION.md)). 4.1 scores the record and 4.2 the disclosure; here the learning is scored for the learner, never the learner for anyone else."
  line: "Human Potential (1.5) protects capability across every dimension; this principle owns how capability is made. Transparency (4.2) owes a person understanding of the AI in front of them in the moment; this principle keeps alive, over time, the capacity that understanding depends on (the consent fabric's capacity-over-time leg, [CONSENT.md](../FOUNDATIONS/CONSENT.md)). Human Judgment (4.5) keeps a human seated in the ethical decision; this principle builds the judgment that will sit there."
