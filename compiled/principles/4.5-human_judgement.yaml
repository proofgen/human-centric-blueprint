binding_rule: a proposed chapter binds nothing at the gate until its cluster compiles; a reconciled chapter is one whose metric bands compile (COVERAGE.yaml, binding_status)
scope: "This principle owns keeping final authority over a morally consequential decision in accountable human hands, and keeping that authority genuine rather than a rubber stamp; it also owns the consent-validity leg that voids a permission asking more than its giver could judge ([CONSENT.md](../FOUNDATIONS/CONSENT.md), leg 6). It is the corpus's seat of ESCALATE: where every other principle's decision to hand a hard case to a human resolves ([Constitution, Article 5](../CONSTITUTION.md); [Lexicon](../FOUNDATIONS/LEXICON.md)). For the answerability of a decision once made, its reasons, its record, and the pathway to contest it, see [P3.4: Algorithmic Accountability](3.4-Algorithmic_Decisions_Require_Transparent_Accountability.md); for the transparency of AI systems to society, [P4.2: Transparency](4.2-Transparency_Is_Essential_to_Human_Agency.md); for fairness in the basis of a decision, [P2.7: Fairness and Non-Discrimination](2.7-Fairness_and_Non-Discrimination.md); for who counts as the authorized human decider, [P2.8: Self-Governance](2.8-Human_Self-Governance_Is_Essential.md) and [Constitution, Article 3](../CONSTITUTION.md); for the affected person's own autonomy, [P2.2: Freedom](2.2-Human_Freedom_Is_Fundamental_and_Inalienable.md); for the human learning capacity that moral deskilling is one case of, [P4.3: Human Learning](4.3-Human_Learning_Capacities_Must_Be_Enhanced_Not_Replaced.md); for the life-and-death emergency where deliberation would cost lives, [P1.1: Human Life](1.1-Human_Life_Is_Sacred_and_Inviolable.md)."
co_requisites_line: "A permission that asked for more than its giver could judge is void, and this principle is where that reach is read. It owns leg 6 of the consent validity bundle ([CONSENT.md](../FOUNDATIONS/CONSENT.md) section 2), beyond their judgment: a consent that asked for more than its giver could judge is void. Every principle that inherits the consent validity bundle names this principle for that leg. It must itself be read together with the owners of the other legs: [P2.4: Human Identity Is Inviolable](2.4-Human_Identity_Is_Inviolable.md) (a consent has no force unless its author is attributable), [P3.1: Vulnerability Must Never Be Exploited](3.1-Vulnerability_Must_Never_Be_Exploited.md) (a consent given without capacity or under coercion is void), [P1.4: Trust Is Fundamental to Human Society](1.4-Trust_Is_Fundamental_to_Human_Society.md) (a consent obtained by deception is void), [P2.3: Human Consciousness Is Inviolable](2.3-Human_Consciousness_Is_Inviolable.md) (a consent steered around judgment is not consent), [P4.2: Transparency Is Essential to Human Agency](4.2-Transparency_Is_Essential_to_Human_Agency.md) (a consent given without comprehension is void), [P3.5: Digital Access Is a Universal Right](3.5-Digital_Access_is_a_Universal_Right.md) (a consent given under necessity at a toll boundary is void)."
